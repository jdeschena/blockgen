# AR-then-block sampler (ARThenBlockAncestralSampler)
# Generates num_ar_tokens tokens left-to-right, then denoises
# remaining blocks with block ancestral sampling.
# For BlockDiT models (algo.backbone = block-dit).
predictor: ar_then_block
block_size: 64            # must match the block size used during training
num_ar_tokens: 64         # must be a multiple of block_size
steps: 128
ar_commit_every_step: true  # true = token-causal, false = block-causal
noise_removal: ancestral    # ancestral / greedy
steps_policy: full          # full / proportional
use_float64: true
use_kv_cache: true
p_nucleus: 1.0
temperature: 1.0
num_sample_batches: 2
num_sample_log: 2
early_stopping: false
